name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      # tests/ 只在本地，不进 git：CI 只检查 src，不跑 pytest
      - name: Mypy
        run: uv run mypy src

      - name: Import contracts
        run: uv run lint-imports

  openspec:
    name: Validate OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # 版本和本地提交前检查用的 openspec 一致；升级本地 CLI 时一起改这里
      - name: Validate specs and changes
        run: npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
