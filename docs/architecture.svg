<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1012" width="1760" height="2024" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13">
  <title>AI Agent US Stock Trading System Architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B4B2A9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="1012" fill="#FFFFFF"/>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#1A1A1A">The scheduler decides when to do what; the Agent gateway handles every model call</text>
  <text x="24" y="47" font-size="11.5" fill="#5F5E5A">Blue boxes call models; the rest is deterministic code. Agents never talk to each other directly: results go into the shared state store,</text>
  <text x="24" y="63" font-size="11.5" fill="#5F5E5A">and the scheduler moves on to the next step. Dashed boxes bypass the case flow.</text>

  <g fill="none" stroke="#B4B2A9" stroke-width="1.25">
    <!-- triggers → scheduler -->
    <path d="M186 104H212" marker-end="url(#a)"/>
    <path d="M314 132V174" marker-end="url(#a)"/>
    <path d="M539 132V174" marker-end="url(#a)"/>
    <path d="M760 132V174" marker-end="url(#a)"/>
    <!-- scheduler opens cases / retrospective cases -->
    <path d="M154 232V314" marker-end="url(#a)"/>
    <path d="M764 232V300" marker-end="url(#a)"/>
    <!-- steps within a case -->
    <path d="M154 372V430" marker-end="url(#a)"/>
    <path d="M154 488V546" marker-end="url(#a)"/>
    <path d="M154 604V662" marker-end="url(#a)"/>
    <path d="M154 720V778" marker-end="url(#a)"/>
    <path d="M262 808H670" marker-end="url(#a)"/>
    <!-- PM, Critic ⇄ Agent gateway -->
    <path d="M262 344H318" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M262 460H318" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- Agent gateway ⇄ sub-agents -->
    <path d="M462 340H498" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M462 402H498" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M462 464H498" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- protection → broker -->
    <path d="M764 722V778" marker-end="url(#a)"/>
  </g>

  <g font-size="11.5" fill="#5F5E5A">
    <text x="164" y="262">open case</text>
    <text x="754" y="258" text-anchor="end">weekly or</text>
    <text x="754" y="276" text-anchor="end">after a sale fills</text>
    <text x="290" y="336" text-anchor="middle">tasks</text>
    <text x="290" y="452" text-anchor="middle">research</text>
    <text x="164" y="398">with a trade plan</text>
    <text x="164" y="416">otherwise the case ends</text>
    <text x="164" y="522">pass (≤ 2 challenges)</text>
    <text x="164" y="638">pass or adjust</text>
    <text x="164" y="754">confirm</text>
    <text x="466" y="800" text-anchor="middle">order</text>
    <text x="774" y="754">bypasses cases</text>
  </g>

  <!-- triggers -->
  <rect x="24" y="76" width="160" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="104" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">Data sources</text>
  <text x="104" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">moomoo · EDGAR · news</text>

  <rect x="214" y="76" width="200" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="314" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">Event detection</text>
  <text x="314" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">pool and positions · price alerts</text>

  <rect x="444" y="76" width="190" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="539" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">Scheduled heartbeat</text>
  <text x="539" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">reviews · catalysts · search · retros</text>

  <rect x="664" y="76" width="192" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="760" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">Custom follow-up</text>
  <text x="760" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">PM requests · code approves</text>

  <!-- scheduler -->
  <rect x="24" y="176" width="832" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="2"/>
  <text x="440" y="200" text-anchor="middle" font-weight="600" fill="#1A1A1A">Scheduler (code)</text>
  <text x="440" y="216" text-anchor="middle" font-size="11.5" fill="#5F5E5A">opens cases · sets the case type · priority queue · advances each step of a case in order · calls no models itself</text>

  <!-- one case -->
  <rect x="24" y="284" width="624" height="576" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="172" y="306" font-weight="600" fill="#1A1A1A">One case (always starts with the PM, advanced in order by the scheduler)</text>

  <rect x="48" y="316" width="212" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.22" stroke="#2F6FDB" stroke-width="2"/>
  <text x="154" y="340" text-anchor="middle" font-weight="600" fill="#1A1A1A">① PM (sole decision maker)</text>
  <text x="154" y="356" text-anchor="middle" font-size="11.5" fill="#1A1A1A">research tasks · conclusion or plan</text>

  <rect x="48" y="432" width="212" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="154" y="456" text-anchor="middle" font-weight="600" fill="#1A1A1A">② Critic (review)</text>
  <text x="154" y="472" text-anchor="middle" font-size="11.5" fill="#1A1A1A">challenges · can veto only openings</text>

  <rect x="48" y="548" width="212" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="154" y="572" text-anchor="middle" font-weight="600" fill="#1A1A1A">③ Risk engine</text>
  <text x="154" y="588" text-anchor="middle" font-size="11.5" fill="#5F5E5A">pass, adjust or reject · reserves budget</text>

  <rect x="48" y="664" width="212" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="154" y="688" text-anchor="middle" font-weight="600" fill="#1A1A1A">④ Human confirmation</text>
  <text x="154" y="704" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Discord buttons · required for openings</text>

  <rect x="48" y="780" width="212" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="154" y="804" text-anchor="middle" font-weight="600" fill="#1A1A1A">⑤ Execution</text>
  <text x="154" y="820" text-anchor="middle" font-size="11.5" fill="#5F5E5A">regular hours · stops · reconciliation</text>

  <!-- Agent gateway -->
  <rect x="320" y="316" width="140" height="172" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/>
  <text x="390" y="380" text-anchor="middle" font-weight="600" fill="#1A1A1A">Agent gateway</text>
  <text x="390" y="398" text-anchor="middle" font-size="11.5" fill="#5F5E5A">(code)</text>
  <text x="390" y="424" text-anchor="middle" font-size="11.5" fill="#5F5E5A">every model call</text>
  <text x="390" y="442" text-anchor="middle" font-size="11.5" fill="#5F5E5A">goes through here</text>

  <!-- sub-agents -->
  <rect x="500" y="316" width="124" height="48" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="562" y="336" text-anchor="middle" font-weight="600" fill="#1A1A1A">News</text>
  <text x="562" y="353" text-anchor="middle" font-size="11.5" fill="#1A1A1A">news signals</text>

  <rect x="500" y="378" width="124" height="48" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="562" y="398" text-anchor="middle" font-weight="600" fill="#1A1A1A">Quant</text>
  <text x="562" y="415" text-anchor="middle" font-size="11.5" fill="#1A1A1A">price-volume signals</text>

  <rect x="500" y="440" width="124" height="48" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="562" y="460" text-anchor="middle" font-weight="600" fill="#1A1A1A">Fundamentals</text>
  <text x="562" y="477" text-anchor="middle" font-size="11.5" fill="#1A1A1A">fundamental signals</text>

  <text x="320" y="514" font-size="11.5" fill="#5F5E5A">Sub-agents run only on tasks from the PM or the Critic</text>

  <!-- retrospective cases -->
  <rect x="672" y="302" width="184" height="90" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="764" y="326" text-anchor="middle" font-weight="600" fill="#1A1A1A">Reviewer (retrospectives)</text>
  <text x="764" y="344" text-anchor="middle" font-size="11.5" fill="#1A1A1A">separate retrospective cases</text>
  <text x="764" y="362" text-anchor="middle" font-size="11.5" fill="#1A1A1A">writes the experience library</text>
  <text x="764" y="380" text-anchor="middle" font-size="11.5" fill="#1A1A1A">model calls also via the gateway</text>

  <!-- health monitor, protection, broker -->
  <rect x="672" y="548" width="184" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="764" y="572" text-anchor="middle" font-weight="600" fill="#1A1A1A">Health monitor</text>
  <text x="764" y="588" text-anchor="middle" font-size="11.5" fill="#5F5E5A">degraded mode on anomalies</text>

  <rect x="672" y="664" width="184" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="764" y="688" text-anchor="middle" font-weight="600" fill="#1A1A1A">Protection outside cases</text>
  <text x="764" y="704" text-anchor="middle" font-size="11.5" fill="#5F5E5A">broker stops · emergency exit</text>

  <rect x="672" y="780" width="184" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="764" y="804" text-anchor="middle" font-weight="600" fill="#1A1A1A">Broker</text>
  <text x="764" y="820" text-anchor="middle" font-size="11.5" fill="#5F5E5A">moomoo</text>

  <!-- data and records -->
  <rect x="24" y="884" width="832" height="104" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="40" y="906" font-weight="600" fill="#1A1A1A">Data and records (PostgreSQL; every module writes; agents only read snapshots or query on demand)</text>

  <rect x="40" y="918" width="256" height="56" rx="8" fill="#EEEDE8" stroke="#B4B2A9" stroke-width="2"/>
  <text x="168" y="942" text-anchor="middle" font-weight="600" fill="#1A1A1A">Shared state store</text>
  <text x="168" y="958" text-anchor="middle" font-size="11.5" fill="#5F5E5A">facts and stock pool · a snapshot per case</text>

  <rect x="312" y="918" width="256" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="440" y="942" text-anchor="middle" font-weight="600" fill="#1A1A1A">Program log · case and trade records</text>
  <text x="440" y="958" text-anchor="middle" font-size="11.5" fill="#5F5E5A">append-only · PM and Critic query on demand</text>

  <rect x="584" y="918" width="256" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="712" y="942" text-anchor="middle" font-weight="600" fill="#1A1A1A">Experience library</text>
  <text x="712" y="958" text-anchor="middle" font-size="11.5" fill="#5F5E5A">written by the Reviewer · read by PM and Critic</text>
</svg>
