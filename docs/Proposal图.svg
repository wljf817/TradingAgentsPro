<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1012" width="1760" height="2024" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Source Han Sans SC',sans-serif" font-size="13">
  <title>AI Agent 美股交易系统架构</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B4B2A9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="1012" fill="#FFFFFF"/>

  <text x="24" y="32" font-size="15" font-weight="600" fill="#1A1A1A">调度器决定何时做什么，Agent 网关负责所有模型调用</text>
  <text x="24" y="54" font-size="11.5" fill="#5F5E5A">蓝色框调用模型，其余是确定性代码；agent 之间不直接对话，结果写进共享状态库，由调度器推进下一步；虚线框不经过案件流程</text>

  <g fill="none" stroke="#B4B2A9" stroke-width="1.25">
    <!-- 触发 → 调度器 -->
    <path d="M186 104H212" marker-end="url(#a)"/>
    <path d="M314 132V174" marker-end="url(#a)"/>
    <path d="M539 132V174" marker-end="url(#a)"/>
    <path d="M760 132V174" marker-end="url(#a)"/>
    <!-- 调度器开案件 / 开复盘案件 -->
    <path d="M154 232V314" marker-end="url(#a)"/>
    <path d="M764 232V300" marker-end="url(#a)"/>
    <!-- 案件内的步骤 -->
    <path d="M154 372V430" marker-end="url(#a)"/>
    <path d="M154 488V546" marker-end="url(#a)"/>
    <path d="M154 604V662" marker-end="url(#a)"/>
    <path d="M154 720V778" marker-end="url(#a)"/>
    <path d="M262 808H670" marker-end="url(#a)"/>
    <!-- PM、Critic ⇄ Agent 网关 -->
    <path d="M262 344H318" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M262 460H318" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- Agent 网关 ⇄ 子 agent -->
    <path d="M462 340H498" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M462 402H498" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M462 464H498" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- 保护 → 券商 -->
    <path d="M764 722V778" marker-end="url(#a)"/>
  </g>

  <g font-size="11.5" fill="#5F5E5A">
    <text x="164" y="262">开案件</text>
    <text x="754" y="258" text-anchor="end">每周一次或</text>
    <text x="754" y="276" text-anchor="end">卖出成交后</text>
    <text x="290" y="336" text-anchor="middle">派发任务</text>
    <text x="290" y="452" text-anchor="middle">补充研究</text>
    <text x="164" y="398">有交易方案时</text>
    <text x="164" y="416">其他结论直接结束案件</text>
    <text x="164" y="522">通过（质询最多 2 轮）</text>
    <text x="164" y="638">通过或调整</text>
    <text x="164" y="754">确认</text>
    <text x="466" y="800" text-anchor="middle">下单</text>
    <text x="774" y="754">绕过案件流程</text>
  </g>

  <!-- 触发 -->
  <rect x="24" y="76" width="160" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="104" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">数据源</text>
  <text x="104" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">moomoo · EDGAR · 新闻</text>

  <rect x="214" y="76" width="200" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="314" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">事件检测层</text>
  <text x="314" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">监控股票池和持仓 · 到价提醒</text>

  <rect x="444" y="76" width="190" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="539" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">定时心跳</text>
  <text x="539" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">复查日 · 催化剂 · 寻股 · 复盘</text>

  <rect x="664" y="76" width="192" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="760" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">自定义跟进</text>
  <text x="760" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">PM 申请 · 代码审批</text>

  <!-- 调度器 -->
  <rect x="24" y="176" width="832" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="2"/>
  <text x="440" y="200" text-anchor="middle" font-weight="600" fill="#1A1A1A">调度器（代码）</text>
  <text x="440" y="216" text-anchor="middle" font-size="11.5" fill="#5F5E5A">开案件 · 定案件类型 · 优先级队列 · 按顺序推进案件的每一步 · 自己不调用模型</text>

  <!-- 一个案件 -->
  <rect x="24" y="284" width="624" height="576" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="172" y="306" font-weight="600" fill="#1A1A1A">一个案件（都从 PM 开始，调度器按顺序推进）</text>

  <rect x="48" y="316" width="212" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.22" stroke="#2F6FDB" stroke-width="2"/>
  <text x="154" y="340" text-anchor="middle" font-weight="600" fill="#1A1A1A">① PM（唯一决策者）</text>
  <text x="154" y="356" text-anchor="middle" font-size="11.5" fill="#1A1A1A">派发研究 · 出结论或方案</text>

  <rect x="48" y="432" width="212" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="154" y="456" text-anchor="middle" font-weight="600" fill="#1A1A1A">② Critic（审核）</text>
  <text x="154" y="472" text-anchor="middle" font-size="11.5" fill="#1A1A1A">质询 · 只能否决开仓</text>

  <rect x="48" y="548" width="212" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="154" y="572" text-anchor="middle" font-weight="600" fill="#1A1A1A">③ 风控引擎</text>
  <text x="154" y="588" text-anchor="middle" font-size="11.5" fill="#5F5E5A">通过、调整或拒绝 · 预留额度</text>

  <rect x="48" y="664" width="212" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="154" y="688" text-anchor="middle" font-weight="600" fill="#1A1A1A">④ 人工确认</text>
  <text x="154" y="704" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Discord 按钮 · 开仓必须确认</text>

  <rect x="48" y="780" width="212" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="154" y="804" text-anchor="middle" font-weight="600" fill="#1A1A1A">⑤ 执行模块</text>
  <text x="154" y="820" text-anchor="middle" font-size="11.5" fill="#5F5E5A">常规时段下单 · 止损单 · 对账</text>

  <!-- Agent 网关 -->
  <rect x="320" y="316" width="140" height="172" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/>
  <text x="390" y="380" text-anchor="middle" font-weight="600" fill="#1A1A1A">Agent 网关</text>
  <text x="390" y="398" text-anchor="middle" font-size="11.5" fill="#5F5E5A">（代码）</text>
  <text x="390" y="424" text-anchor="middle" font-size="11.5" fill="#5F5E5A">所有模型调用</text>
  <text x="390" y="442" text-anchor="middle" font-size="11.5" fill="#5F5E5A">都经过这里</text>

  <!-- 子 agent -->
  <rect x="500" y="316" width="124" height="48" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="562" y="336" text-anchor="middle" font-weight="600" fill="#1A1A1A">News</text>
  <text x="562" y="353" text-anchor="middle" font-size="11.5" fill="#1A1A1A">新闻信号</text>

  <rect x="500" y="378" width="124" height="48" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="562" y="398" text-anchor="middle" font-weight="600" fill="#1A1A1A">Quant</text>
  <text x="562" y="415" text-anchor="middle" font-size="11.5" fill="#1A1A1A">量价信号</text>

  <rect x="500" y="440" width="124" height="48" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="562" y="460" text-anchor="middle" font-weight="600" fill="#1A1A1A">Fundamentals</text>
  <text x="562" y="477" text-anchor="middle" font-size="11.5" fill="#1A1A1A">基本面信号</text>

  <text x="320" y="514" font-size="11.5" fill="#5F5E5A">子 agent 只在收到 PM 或 Critic 的任务时运行</text>

  <!-- 复盘案件 -->
  <rect x="672" y="302" width="184" height="72" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="764" y="326" text-anchor="middle" font-weight="600" fill="#1A1A1A">Reviewer（复盘）</text>
  <text x="764" y="344" text-anchor="middle" font-size="11.5" fill="#1A1A1A">单独的复盘案件 · 写入经验库</text>
  <text x="764" y="362" text-anchor="middle" font-size="11.5" fill="#1A1A1A">模型调用也经过 Agent 网关</text>

  <!-- 健康监控、保护、券商 -->
  <rect x="672" y="548" width="184" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="764" y="572" text-anchor="middle" font-weight="600" fill="#1A1A1A">健康监控</text>
  <text x="764" y="588" text-anchor="middle" font-size="11.5" fill="#5F5E5A">异常时进入降级模式</text>

  <rect x="672" y="664" width="184" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="764" y="688" text-anchor="middle" font-weight="600" fill="#1A1A1A">不经过主流程的保护</text>
  <text x="764" y="704" text-anchor="middle" font-size="11.5" fill="#5F5E5A">券商端止损单 · 紧急风险退出</text>

  <rect x="672" y="780" width="184" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="764" y="804" text-anchor="middle" font-weight="600" fill="#1A1A1A">券商</text>
  <text x="764" y="820" text-anchor="middle" font-size="11.5" fill="#5F5E5A">moomoo</text>

  <!-- 数据与记录 -->
  <rect x="24" y="884" width="832" height="104" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="40" y="906" font-weight="600" fill="#1A1A1A">数据与记录（PostgreSQL；所有模块写入，agent 只读快照或按需查询）</text>

  <rect x="40" y="918" width="256" height="56" rx="8" fill="#EEEDE8" stroke="#B4B2A9" stroke-width="2"/>
  <text x="168" y="942" text-anchor="middle" font-weight="600" fill="#1A1A1A">共享状态库</text>
  <text x="168" y="958" text-anchor="middle" font-size="11.5" fill="#5F5E5A">当前事实和股票池 · 每个案件一份快照</text>

  <rect x="312" y="918" width="256" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="440" y="942" text-anchor="middle" font-weight="600" fill="#1A1A1A">程序日志 · 案件记录 · 交易记录</text>
  <text x="440" y="958" text-anchor="middle" font-size="11.5" fill="#5F5E5A">只追加 · PM 和 Critic 按需查询</text>

  <rect x="584" y="918" width="256" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="712" y="942" text-anchor="middle" font-weight="600" fill="#1A1A1A">经验库</text>
  <text x="712" y="958" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Reviewer 写入 · PM 和 Critic 查询</text>
</svg>
