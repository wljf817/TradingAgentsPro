<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 948" width="1520" height="1896" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Source Han Sans SC',sans-serif" font-size="13">
  <title>AI Agent 美股交易系统架构</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B4B2A9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="948" fill="#FFFFFF"/>

  <text x="24" y="32" font-size="15" font-weight="600" fill="#1A1A1A">调度器管何时做什么，Agent 网关管任务转发</text>
  <text x="24" y="54" font-size="11.5" fill="#5F5E5A">蓝色框调用模型；其余为确定性代码；虚线框不经过主流程</text>

  <g fill="none" stroke="#B4B2A9" stroke-width="1.25">
    <path d="M247 104H293" marker-end="url(#a)"/>
    <path d="M395 132V170" marker-end="url(#a)"/>
    <path d="M640 132V200H482" marker-end="url(#a)"/>
    <path d="M700 268V214H482" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M300 228V266" marker-end="url(#a)"/>
    <path d="M292 364V384" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M118 432V458" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M292 432V458" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M466 432V458" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M578 413H598" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M292 540V578" marker-end="url(#a)"/>
    <path d="M205 580V432" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M434 608H560V334H434" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M620 676V542" marker-end="url(#a)"/>
    <path d="M292 636V674" marker-end="url(#a)"/>
    <path d="M292 732V770" marker-end="url(#a)"/>
    <path d="M518 800H434" marker-end="url(#a)"/>
    <path d="M292 828V866" marker-end="url(#a)"/>
    <path d="M434 896H518" marker-end="url(#a)"/>
  </g>

  <g font-size="11.5" fill="#5F5E5A">
    <text x="591" y="244" text-anchor="middle">案件状态</text>
    <text x="310" y="252">唤醒 PM</text>
    <text x="302" y="379">Task / Result</text>
    <text x="302" y="564">PM 方案</text>
    <text x="197" y="564" text-anchor="end">补充研究</text>
    <text x="497" y="600" text-anchor="middle">质询 · 回应</text>
    <text x="628" y="612">系统健康状态</text>
    <text x="302" y="660">通过审核</text>
    <text x="302" y="756">通过</text>
    <text x="476" y="792" text-anchor="middle">直接下单</text>
  </g>

  <!-- 触发 -->
  <rect x="65" y="76" width="180" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="155" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">数据源</text>
  <text x="155" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">moomoo · EDGAR · 新闻</text>

  <rect x="295" y="76" width="200" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="395" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">事件检测层</text>
  <text x="395" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">只监控股票池和持仓</text>

  <rect x="550" y="76" width="180" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="640" y="100" text-anchor="middle" font-weight="600" fill="#1A1A1A">定时心跳 · 自定义跟进</text>
  <text x="640" y="116" text-anchor="middle" font-size="11.5" fill="#5F5E5A">复查日 · 催化剂 · 寻股 · 跟进</text>

  <!-- 调度器 -->
  <rect x="120" y="172" width="360" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="2"/>
  <text x="300" y="196" text-anchor="middle" font-weight="600" fill="#1A1A1A">调度器（Orchestrator）</text>
  <text x="300" y="212" text-anchor="middle" font-size="11.5" fill="#5F5E5A">案件类型 · 优先级队列 · 状态机 · 冷却</text>

  <!-- 决策层 -->
  <rect x="24" y="268" width="552" height="272" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="40" y="292" font-weight="600" fill="#1A1A1A">决策层 · PM 与子 agent</text>

  <rect x="152" y="306" width="280" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.22" stroke="#2F6FDB" stroke-width="2"/>
  <text x="292" y="330" text-anchor="middle" font-weight="600" fill="#1A1A1A">PM（单模型）</text>
  <text x="292" y="346" text-anchor="middle" font-size="11.5" fill="#1A1A1A">dispatch_tasks · submit_conclusion</text>

  <rect x="40" y="386" width="504" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/>
  <text x="292" y="404" text-anchor="middle" font-weight="600" fill="#1A1A1A">Agent 网关（代码）</text>
  <text x="292" y="421" text-anchor="middle" font-size="11.5" fill="#5F5E5A">校验规则与预算 · 调用模型 · 校验输出</text>

  <rect x="40" y="460" width="156" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="118" y="484" text-anchor="middle" font-weight="600" fill="#1A1A1A">News</text>
  <text x="118" y="500" text-anchor="middle" font-size="11.5" fill="#1A1A1A">新闻信号</text>

  <rect x="214" y="460" width="156" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="292" y="484" text-anchor="middle" font-weight="600" fill="#1A1A1A">Quant</text>
  <text x="292" y="500" text-anchor="middle" font-size="11.5" fill="#1A1A1A">量价信号</text>

  <rect x="388" y="460" width="156" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="466" y="484" text-anchor="middle" font-weight="600" fill="#1A1A1A">Fundamentals</text>
  <text x="466" y="500" text-anchor="middle" font-size="11.5" fill="#1A1A1A">基本面信号</text>

  <!-- 共享状态库 -->
  <rect x="600" y="268" width="136" height="272" rx="8" fill="#EEEDE8" stroke="#B4B2A9" stroke-width="2"/>
  <text x="668" y="362" text-anchor="middle" font-weight="600" fill="#1A1A1A">共享状态库</text>
  <text x="668" y="386" text-anchor="middle" font-size="11.5" fill="#5F5E5A">当前市场事实</text>
  <text x="668" y="404" text-anchor="middle" font-size="11.5" fill="#5F5E5A">当前任务状态</text>
  <text x="668" y="422" text-anchor="middle" font-size="11.5" fill="#5F5E5A">已产出的结构化结果</text>
  <text x="668" y="446" text-anchor="middle" font-size="11" fill="#5F5E5A">含股票池、论点、复查日</text>

  <!-- 审核层 -->
  <rect x="152" y="580" width="280" height="56" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
  <text x="292" y="604" text-anchor="middle" font-weight="600" fill="#1A1A1A">Critic（审核层）</text>
  <text x="292" y="620" text-anchor="middle" font-size="11.5" fill="#1A1A1A">质询 · 补充研究 · 只能否决开仓</text>

  <!-- 健康监控 -->
  <rect x="550" y="676" width="180" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="640" y="700" text-anchor="middle" font-weight="600" fill="#1A1A1A">健康监控</text>
  <text x="640" y="716" text-anchor="middle" font-size="11.5" fill="#5F5E5A">异常时进入降级模式</text>

  <!-- 不经过主流程的保护 -->
  <rect x="520" y="772" width="200" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="620" y="796" text-anchor="middle" font-weight="600" fill="#1A1A1A">不经过主流程的保护</text>
  <text x="620" y="812" text-anchor="middle" font-size="11.5" fill="#5F5E5A">券商端止损单 · 紧急风险退出</text>

  <!-- 风控、执行、记录 -->
  <rect x="152" y="676" width="280" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="292" y="700" text-anchor="middle" font-weight="600" fill="#1A1A1A">风控引擎（代码）</text>
  <text x="292" y="716" text-anchor="middle" font-size="11.5" fill="#5F5E5A">通过、调整或拒绝 · 额度预留</text>

  <rect x="152" y="772" width="280" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="292" y="796" text-anchor="middle" font-weight="600" fill="#1A1A1A">人工确认 → 执行</text>
  <text x="292" y="812" text-anchor="middle" font-size="11.5" fill="#5F5E5A">常规时段下单 · 止损单 · 对账</text>

  <rect x="152" y="868" width="280" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="292" y="892" text-anchor="middle" font-weight="600" fill="#1A1A1A">程序记录 · 历史记录 · 经验库</text>
  <text x="292" y="908" text-anchor="middle" font-size="11.5" fill="#5F5E5A">只追加 · PM 和 Critic 按需查询</text>

  <rect x="520" y="868" width="200" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1.25"/>
  <text x="620" y="892" text-anchor="middle" font-weight="600" fill="#1A1A1A">复盘与评估</text>
  <text x="620" y="908" text-anchor="middle" font-size="11.5" fill="#5F5E5A">单笔和每周复盘 · 提炼经验</text>
</svg>
