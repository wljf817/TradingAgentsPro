[project]
name = "tradingagentspro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "dbos>=3.2.0",
    "discord-py>=2.7.1",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "moomoo-api>=10.11.7108",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
tradingagentspro = "tradingagentspro.bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grimp>=3.17",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "TID", "RUF"]
# 中文全角标点不算易混淆字符；西里尔字母等仍然会报。
allowed-confusables = ["，", "；", "：", "？", "！", "‘", "’", "（", "）", "～", "％", "＋", "－", "＝"]

# 时间和 ID 都要能在回放时重现，只能从 Clock 和 ID 生成端口获取。
# 需要放行的实现文件在 per-file-ignores 里单独放行 TID251。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time".msg = "time 模块全项目禁用：读取时间通过 Clock，等待用 DBOS 的持久化休眠"
"datetime.datetime.now".msg = "当前时间通过 Clock 获取"
"datetime.datetime.utcnow".msg = "当前时间通过 Clock 获取"
"datetime.datetime.today".msg = "当前时间通过 Clock 获取"
"datetime.date.today".msg = "当前日期通过 Clock 获取"
"uuid.uuid1".msg = "ID 通过 ID 生成端口获取，回放时才能重现"
"uuid.uuid4".msg = "ID 通过 ID 生成端口获取，回放时才能重现"

[tool.ruff.lint.per-file-ignores]
# 时区守卫要调用 time.tzset()。
"tests/conftest.py" = ["TID251"]
# 系统时钟是全项目唯一可以读取系统时间的地方。
"src/tradingagentspro/integrations/system_clock.py" = ["TID251"]
# 随机 ID 是全项目唯一可以调用 uuid4 的地方。
"src/tradingagentspro/integrations/random_ids.py" = ["TID251"]

[tool.importlinter]
root_package = "tradingagentspro"

# 顶层分层：上层可以依赖下层；workflows 和 integrations 互相不能 import。
[[tool.importlinter.contracts]]
id = "top-layers"
name = "顶层分层"
type = "layers"
containers = ["tradingagentspro"]
layers = ["bootstrap", "workflows | integrations", "modules", "contracts", "shared"]

# 模块内部分层：service 和 repo 互相独立；模块里只能出现这几种文件。
# 每一层都是可选的，因为模块是逐步长出来的。
[[tool.importlinter.contracts]]
id = "module-layers"
name = "模块内部分层"
type = "layers"
containers = ["tradingagentspro.modules.*"]
layers = ["(service) | (repo)", "(ports)", "(domain)", "(config)"]
exhaustive = true

# 任何一层的兄弟包之间都不能循环依赖。
[[tool.importlinter.contracts]]
id = "acyclic"
name = "包之间无循环依赖"
type = "acyclic_siblings"
ancestors = ["tradingagentspro"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# Pydantic 模型的构造函数按字段类型严格检查：给 Decimal 字段传 float 会报错。
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# exchange_calendars 没有 py.typed；按它自己的类型标注检查，而不是整个当作 Any。
[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
follow_untyped_imports = true

# moomoo-api 和它返回的 pandas 对象没有类型标注，整个当作 Any；类型边界在 integrations/moomoo 里。
[[tool.mypy.overrides]]
module = ["moomoo", "moomoo.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 连真实 Alpaca 模拟盘、连本机 OpenD、连真实 Discord 的冒烟测试默认不运行，
# 用 uv run pytest -m alpaca_paper、uv run pytest -m moomoo_opend、uv run pytest -m discord_bot 运行。
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not alpaca_paper and not moomoo_opend and not discord_bot",
]
markers = [
    "alpaca_paper: 连真实的 Alpaca 模拟盘，需要 APCA_API_KEY_ID 和 APCA_API_SECRET_KEY",
    "moomoo_opend: 连本机的 moomoo OpenD，需要 OpenD 开着并已登录",
    "discord_bot: 连真实的 Discord，需要 DISCORD_BOT_TOKEN、DISCORD_GUILD_ID、DISCORD_CHANNEL_ID 和 DISCORD_USER_ID",
]
