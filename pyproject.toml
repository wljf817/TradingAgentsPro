[project]
name = "tradingagentspro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "exchange-calendars>=4.13.2",
]

[project.scripts]
tradingagentspro = "tradingagentspro.bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grimp>=3.17",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "TID", "RUF"]
# 中文全角标点不算易混淆字符；西里尔字母等仍然会报。
allowed-confusables = ["，", "；", "：", "？", "！", "‘", "’", "（", "）", "～", "％", "＋", "－", "＝"]

# 时间和 ID 都要能在回放时重现，只能从 Clock 和 ID 生成端口获取。
# 需要放行的实现文件在 per-file-ignores 里单独放行 TID251。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time".msg = "time 模块全项目禁用：读取时间通过 Clock，等待用 DBOS 的持久化休眠"
"datetime.datetime.now".msg = "当前时间通过 Clock 获取"
"datetime.datetime.utcnow".msg = "当前时间通过 Clock 获取"
"datetime.datetime.today".msg = "当前时间通过 Clock 获取"
"datetime.date.today".msg = "当前日期通过 Clock 获取"
"uuid.uuid1".msg = "ID 通过 ID 生成端口获取，回放时才能重现"
"uuid.uuid4".msg = "ID 通过 ID 生成端口获取，回放时才能重现"

[tool.ruff.lint.per-file-ignores]
# 时区守卫要调用 time.tzset()。
"tests/conftest.py" = ["TID251"]
# 系统时钟是全项目唯一可以读取系统时间的地方。
"src/tradingagentspro/integrations/system_clock.py" = ["TID251"]

[tool.importlinter]
root_package = "tradingagentspro"

# 顶层分层：上层可以依赖下层；workflows 和 integrations 互相不能 import。
[[tool.importlinter.contracts]]
id = "top-layers"
name = "顶层分层"
type = "layers"
containers = ["tradingagentspro"]
layers = ["bootstrap", "workflows | integrations", "modules", "contracts", "shared"]

# 模块内部分层：service 和 repo 互相独立；模块里只能出现这几种文件。
# 每一层都是可选的，因为模块是逐步长出来的。
[[tool.importlinter.contracts]]
id = "module-layers"
name = "模块内部分层"
type = "layers"
containers = ["tradingagentspro.modules.*"]
layers = ["(service) | (repo)", "(ports)", "(domain)", "(config)"]
exhaustive = true

# 任何一层的兄弟包之间都不能循环依赖。
[[tool.importlinter.contracts]]
id = "acyclic"
name = "包之间无循环依赖"
type = "acyclic_siblings"
ancestors = ["tradingagentspro"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# exchange_calendars 没有 py.typed；按它自己的类型标注检查，而不是整个当作 Any。
[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
