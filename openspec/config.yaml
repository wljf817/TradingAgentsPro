schema: spec-driven

context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。
  OpenSpec 的结构性标题（## ADDED Requirements、### Requirement:、#### Scenario: 等）
  以及 SHALL/MUST、GIVEN/WHEN/THEN 关键字保持英文，校验依赖它们。

  项目：AI Agent 美股交易系统（长期维护）
  设计来源：docs/AI Agent 美股交易系统需求 Proposal 简版.md（核心原则）
            docs/AI Agent 美股交易系统需求 Proposal.md（完整规则）
  两份 Proposal 的用法：
  - 简版已经固定，不可更改，也不对它提修改建议
  - 完整版是写 spec 的参考，只读当前变更对应的章节
  - 当前变更对应的完整版章节有问题（矛盾、缺口、不可行）时，主动在 proposal 末尾「需要人决定」中提出，并给出推荐做法
  - 完整版其他章节的问题，在人没有要求时一律忽略，不报告

  技术栈：Python 3.13 + uv（src 布局：src/tradingagentspro/）、DBOS、PydanticAI、Pydantic、
  PostgreSQL、moomoo OpenAPI + OpenD、SEC EDGAR、discord.py；测试 pytest，检查 ruff 和 mypy（strict），CI 用 GitHub Actions。

  架构铁律（任何变更都不得违反）：
  - 只有 PM、子Agents、Reviewer、Critic 调用模型；触发、调度、风控、下单全部是确定性代码
  - 调度器不调用模型、不做交易判断、不下单；只有执行模块能下单
  - agent 之间不直接通信，只通过 Agent 网关转发的 Task / Result 协作
  - 共享状态库是事实的唯一来源；每类字段只有一个写入者，只追加不覆盖；同一案件读同一份快照
  - 任何交易必须通过代码风控，开仓必须人工确认
  
  编程架构：
  - 模块化单体 + 端口/适配器：单进程，按业务拆模块，外部系统一律通过接口（Protocol）接入
  - 分层（从上到下）：bootstrap → workflows | integrations → modules → contracts → shared。
    上层可以依赖下层，反过来不行；workflows 和 integrations 互相不能 import；integrations 实现 modules 定义的 ports。
    由 import-linter 强制（pyproject.toml 的 top-layers 契约）
  - 包根和 6 个层级包的 __init__.py 只放 docstring：import 任何子模块都会先执行它们
  - 模块内部只能有这几种文件（module-layers 契约）：__init__.py（公开 API）、service.py（用例）、repo.py、
    ports.py（外部接口）、domain/（纯逻辑，规则见下面的"纯区域"）、config.py（阈值和默认值）。
    分层：service 和 repo 互相独立 → ports → domain → config
  - 存储：存储接口放 ports；repo 放本模块的表和这个接口的数据库实现；service 只依赖接口、不直接用 repo，
    由 bootstrap 注入实现（单元测试用 tests/fakes/ 的内存实现）
  - 包和包之间、单个文件之间都不能有循环依赖（acyclic 契约和架构测试），跨模块的流程放进 workflows 编排
  - 模块之外的任何代码（其他模块、workflows、integrations、bootstrap）只能 import 模块的包根，
    不读别的模块的表；integrations 要实现的端口协议、bootstrap 要装配的实现都由模块包根导出
  - 纯区域（shared、contracts、各模块的 domain 和 config）：只能 import 白名单里的标准库和规定范围内的项目内包，
    第三方包只有 contracts 和 config 可以用 pydantic；不能使用 open、print、eval、__import__、id、hash 等内置名字。
    白名单和禁用名单在 tests/architecture/rules.py，扩充时在变更里修改，并在那个变更的 design 里写明理由
  - domain 可以接收 shared 中纯计算、无 I/O 的协议（比如交易日历），但不接收 Clock，"现在"作为参数传入
  - 扩展靠新增实现再注册，不改已有代码：新数据源或券商写新适配器，新风控规则实现 RiskRule，新 agent 加 prompt 并注册
  - live / paper / replay 共用同一套业务代码，只在 bootstrap 切换实现
  - 金额、价格、数量用 Decimal；时间从 Clock 取并存 UTC，交易日用交易所日历库
  - 任何计算都不能依赖本机时区；time 模块全项目禁用（Ruff 强制），读取时间和等待都通过 Clock
  - 外部写操作必须幂等（客户端订单 ID、task_id 去重）；DBOS 工作流保持确定性，I/O 和模型调用放在 step 里

  测试约定：
  - 测试目录镜像 src/ 的结构，比如 tests/modules/<模块>/domain/
  - 测试替身（各端口的内存实现）放 tests/fakes/；回放模式用的实现属于正式代码，放 integrations/
  - 测试进程固定在 UTC+14 时区运行（tests/conftest.py），期望值一律用显式时区写出

rules:
  proposal:
    - 写明引用了 Proposal 的哪些章节，以及本次明确不做的范围（Non-goals）
    - 一个变更只有一个能用一句话说清的目的，过大就拆分
    - 末尾加「需要人决定」一节：列出本次变更对应的完整版 Proposal 章节里的问题，每条附推荐做法；没有就写"无"
  specs:
    - 规则表、优先级、阈值、状态机的每一行都要有对应的 Scenario
    - 必须覆盖边界值和异常情况（超时、断线、预算用尽、数据缺失），不只是正常路径
    - 阈值写成可配置项并给出默认值，不要硬编码在需求里
  design:
    - 说明模块边界：本次涉及哪些模块、模块之间传递哪些 Pydantic 模型
  tasks:
    - 确定性规则先写测试再写实现
    - 每个任务能在一次会话内完成

operations:
  apply:
    guidance:
      - 每完成一组任务运行 uv run pytest、uv run ruff check 和 uv run mypy
      - 发现 spec 或 design 与实际不符时，先更新文档再改代码
